name: aeroclima
services:
  api:
    build:
      context: .
      target: development
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aeroclima}
      DB_USER: ${DB_USER:-aeroclima}
      DB_PASSWORD: ${DB_PASSWORD:?Copie .env.example para .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      TSC_WATCHFILE: DynamicPriorityPolling
    volumes:
      - ./src:/app/src
      - ./test:/app/test
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 5
  frontend:
    build:
      context: ../aeroclima-frontend
      target: development
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_API_BASE_URL: /api/v1
    volumes:
      - ../aeroclima-frontend/src:/app/src
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DB_NAME:-aeroclima}
      POSTGRES_USER: ${DB_USER:-aeroclima}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
