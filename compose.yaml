services:
  api:
    build: .
    container_name: aeroclima-api
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PORT=${PORT:-3000}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-aeroclima}
      - JWT_SECRET=${JWT_SECRET:-aeroclima_super_secreto_chave_jwt_2026}
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: aeroclima-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-aeroclima}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: